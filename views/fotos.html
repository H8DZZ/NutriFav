<div class="content-body">

    <div class="page-header">

        </div>
        <div class="header-actions">
            <div class="selection-bar" id="selectionBar">
                <span class="counter">Seleccionadas: <strong id="selectedCount">0</strong>/2</span>
                <button class="btn-compare" id="btnCompare" disabled>
                    <span class="material-symbols-outlined">compare_arrows</span>

            </div>
            <button class="btn btn-primary" id="btnSubirFotos">

    <div id="galleryContainer">

    <div class="modal-overlay hidden" id="photoModal">
